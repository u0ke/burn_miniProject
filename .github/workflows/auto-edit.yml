name: Auto Edit Code

on:
  schedule:
    - cron: '0 8,20 * * *'   # runs at 08:00 and 20:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bot
        run: python bot.py

      - name: Commit & push changes
        run: |
          git config user.name "auto-bot"
          git config user.email "auto-bot@users.noreply.github.com"
          git add .
          git commit -m " auto ${GITHUB_RUN_NUMBER}" || exit 0
          git push